[package]
name = "snare"
version = "0.1.0"
edition = "2024"
description = "An embeddable, interactive programming language with JSON at its core"

[dependencies]
pest = "2.8"
pest_derive = "2.8"
rustyline = "17"
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
